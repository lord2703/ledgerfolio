# Nginx site for Ledgerfolio.
#
#   sudo cp deploy/nginx/ledgerfolio.conf /etc/nginx/sites-available/ledgerfolio
#   sudo ln -s /etc/nginx/sites-available/ledgerfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com   # adds HTTPS
#
# Replace example.com with your domain. The blockchain node (port 8001) is
# deliberately NOT exposed here: only Django talks to it, on localhost.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 10M;  # project screenshot uploads

    location /static/ {
        alias /srv/ledgerfolio/staticfiles/;
        # Browsers keep these files but ask "has it changed?" each time (a tiny
        # reply when it has not), so a new version shows up right after a deploy.
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Public uploads (project screenshots) only. Receipt PDFs live in
    # /srv/ledgerfolio/private_media and are never served by Nginx.
    location /media/ {
        alias /srv/ledgerfolio/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
