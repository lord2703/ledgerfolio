{# One form field: label, input, help text and errors. Django links the help text with aria-describedby. #}
<div class="field{% if field.errors %} field--error{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="field__optional">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}
    <p class="field__error" role="alert"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-alert"/></svg>{{ error }}</p>
  {% endfor %}
</div>
