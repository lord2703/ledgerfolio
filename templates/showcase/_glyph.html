{# Line-art emblem for a system that has no screenshot yet. Matches its 3D preview style. #}
<svg class="card__glyph" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
  {% if style == "knot" %}
    <ellipse cx="60" cy="60" rx="46" ry="20"/>
    <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(60 60 60)" class="stroke-accent"/>
    <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(120 60 60)"/>
    <circle cx="60" cy="60" r="5" class="stroke-accent"/>
  {% elif style == "stack" %}
    <path d="M60 22 104 42 60 62 16 42z" class="stroke-accent"/>
    <path d="M16 60l44 20 44-20"/>
    <path d="M16 78l44 20 44-20"/>
    <path d="M16 42v36M104 42v36M60 62v36" opacity=".45"/>
  {% elif style == "orbit" %}
    <circle cx="60" cy="60" r="16" class="stroke-accent"/>
    <ellipse cx="60" cy="60" rx="50" ry="18" transform="rotate(-24 60 60)"/>
    <ellipse cx="60" cy="60" rx="50" ry="18" transform="rotate(38 60 60)" opacity=".6"/>
    <circle cx="105" cy="40" r="3.5" fill="currentColor"/>
    <circle cx="22" cy="30" r="2.5" fill="currentColor"/>
  {% elif style == "lattice" %}
    <path d="M24 24h72v72H24zM60 24v72M24 60h72" opacity=".6"/>
    <path d="M24 24l72 72M96 24 24 96" class="stroke-accent" opacity=".7"/>
    <g fill="currentColor"><circle cx="24" cy="24" r="4"/><circle cx="60" cy="24" r="4"/><circle cx="96" cy="24" r="4"/><circle cx="24" cy="60" r="4"/><circle cx="96" cy="60" r="4"/><circle cx="24" cy="96" r="4"/><circle cx="60" cy="96" r="4"/><circle cx="96" cy="96" r="4"/></g>
    <circle cx="60" cy="60" r="8" class="stroke-accent"/>
  {% elif style == "prism" %}
    <path d="M60 14 100 84H20z" class="stroke-accent"/>
    <path d="M60 14l14 18 40 70-14-18zM100 84l14 18H34L20 84" opacity=".6"/>
    <path d="M60 14v52M60 66 20 84M60 66l40 18" opacity=".45"/>
  {% else %}
    <path d="M60 8 104 60 60 112 16 60z" class="stroke-accent"/>
    <path d="M16 60l44 14 44-14M60 8v66M60 74v38"/>
    <path d="M16 60l44-14 44 14" opacity=".45"/>
  {% endif %}
</svg>
